[package]
name = "distro-builder"
version = "0.1.0"
edition = "2021"
description = "Shared infrastructure for building LevitateOS and AcornOS ISOs"
license = "MIT OR Apache-2.0"

[dependencies]
recqemu = { path = "../../tools/recqemu" }
anyhow = "1.0"
distro-contract = { path = "../contract" }
distro-profile = { path = "../profile" }
recinit = { path = "../../tools/recinit" }
# install_tools::AB_ONLY_TREE, DEFAULT_SET_DIR, RECIPE_CACHE_DIR: where the live medium keeps
# what only an A/B system gets, the default software set and its package cache.
recstrap = { path = "../../tools/recstrap" }
reciso = { path = "../../tools/reciso" }
recuki = { path = "../../tools/recuki" }
libc = "0.2"
levitate-recipe = { path = "../../tools/recipe" }
# The kernel pins in os-recipes/kernel/metadata.rhai, read by src/pipeline/kernel.rs.
rhai = "=1.19.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
walkdir = "2"
# The small archives of a release (boot.tar.zst, recipes.tar.zst; src/update_release.rs).
tar = "0.4"
which = "5.0"
tempfile = "3"
