[package]
name = "distro-builder"
version = "0.1.0"
edition = "2021"
autobins = false
description = "Shared infrastructure for building LevitateOS and AcornOS ISOs"
license = "MIT OR Apache-2.0"

[dependencies]
recqemu = { path = "../../tools/recqemu" }
anyhow = "1.0"
distro-contract = { path = "../contract" }
recinit = { path = "../../tools/recinit" }
libc = "0.2"
levitate-recipe = { path = "../../tools/recipe" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
walkdir = "2"
which = "5.0"
time = "0.3"
tempfile = "3"

[[bin]]
name = "distro-builder"
path = "src/bin/distro-builder.rs"
